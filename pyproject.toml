[project]
name = "hanium-lipreading"
version = "0.1.0"
description = "Korean lipreading vision AI for closed-set phrase classification"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "mediapipe",
    "tqdm",
    "scikit-learn",
    "tensorboard",
    "ffmpeg-python",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
package = false

[tool.uv.sources]
# PyTorch is intentionally not pinned here because the project uses GPU-specific
# ROCm/CUDA wheels depending on each developer's machine. Install it separately
# after `uv sync` using the command recommended by PyTorch/ROCm.
