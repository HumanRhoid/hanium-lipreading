[project]
name = "hanium-lipreading"
version = "0.1.0"
description = "Korean lipreading vision AI for closed-set phrase classification"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "mediapipe",
    "tqdm",
    "scikit-learn",
    "tensorboard",
    "ffmpeg-python",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "gpu: 실제 CUDA 또는 ROCm GPU가 필요한 테스트",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
package = false

[tool.uv.sources]
# PyTorch는 개발자별 GPU 환경에 따라 ROCm/CUDA wheel이 달라 이 파일에 고정하지 않습니다.
# `uv sync` 실행 후 PyTorch/ROCm 공식 안내에 맞는 패키지를 별도로 설치하세요.
