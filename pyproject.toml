[project]
name = "hanium-lipreading"
version = "0.1.0"
description = "Korean lipreading vision AI for closed-set phrase classification"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "numpy",
    "pandas",
    "opencv-python",
    "mediapipe",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "tqdm",
    "scikit-learn",
    "tensorboard",
    "ffmpeg-python",
    "uvicorn[standard]",
    "pwdlib[argon2]>=0.3.1",
    "torch",
]

[dependency-groups]
dev = [
    "httpx2",
    "ipykernel",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"
markers = [
    "integration: 실제 PostgreSQL 등 외부 런타임이 필요한 통합 테스트",
    "gpu: 실제 CUDA 또는 ROCm GPU가 필요한 테스트",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }