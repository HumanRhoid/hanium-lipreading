<svg viewBox="0 0 940 760" width="940" height="760" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, 'Malgun Gothic', sans-serif">
  <title>구순을 읽자 — 립리딩 시스템 아키텍처</title>
  <desc>입모양 영상을 전처리하고 AI 모델로 문구를 분류해 텍스트와 음성으로 출력하는 추론 흐름과, 데이터로 모델을 학습시키는 학습 흐름을 나타낸 다이어그램.</desc>

  <rect x="0" y="0" width="940" height="760" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#26215C">👄 구순을 읽자 — 시스템 아키텍처</text>
  <text x="40" y="68" font-size="13" fill="#534AB7">입모양 영상 → 한국어 문구 인식 (환자 AAC)</text>

  <rect x="700" y="30" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="720" y="42" font-size="12" fill="#26215C">추론 흐름</text>
  <rect x="790" y="30" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="810" y="42" font-size="12" fill="#04342C">학습 흐름</text>

  <text x="560" y="108" font-size="13" font-weight="700" fill="#534AB7" text-anchor="middle">▼ 추론 (실사용)</text>

  <rect x="440" y="120" width="240" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="560" y="142" font-size="14" font-weight="700" fill="#26215C" text-anchor="middle">👤 입력 영상 / 웹캠</text>
  <text x="560" y="159" font-size="11" fill="#534AB7" text-anchor="middle">환자의 입모양</text>

  <rect x="440" y="195" width="240" height="84" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="560" y="216" font-size="14" font-weight="700" fill="#26215C" text-anchor="middle">⚙️ 전처리</text>
  <rect x="452" y="226" width="68" height="42" rx="6" fill="#fff" stroke="#AFA9EC"/>
  <text x="486" y="244" font-size="10" fill="#26215C" text-anchor="middle">ffmpeg</text>
  <text x="486" y="258" font-size="9" fill="#534AB7" text-anchor="middle">25fps</text>
  <rect x="526" y="226" width="68" height="42" rx="6" fill="#fff" stroke="#AFA9EC"/>
  <text x="560" y="244" font-size="10" fill="#26215C" text-anchor="middle">OpenCV</text>
  <text x="560" y="258" font-size="9" fill="#534AB7" text-anchor="middle">프레임화</text>
  <rect x="600" y="226" width="68" height="42" rx="6" fill="#fff" stroke="#AFA9EC"/>
  <text x="634" y="241" font-size="10" fill="#26215C" text-anchor="middle">MediaPipe</text>
  <text x="634" y="255" font-size="9" fill="#534AB7" text-anchor="middle">입 ROI 크롭</text>

  <rect x="440" y="305" width="240" height="84" rx="10" fill="#7F77DD" stroke="#534AB7" stroke-width="2"/>
  <text x="560" y="328" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">🧠 AI 모델</text>
  <text x="560" y="349" font-size="11" fill="#EEEDFE" text-anchor="middle">3D-CNN + ResNet (입모양)</text>
  <text x="560" y="365" font-size="11" fill="#EEEDFE" text-anchor="middle">BiGRU (순서) → FC (분류)</text>
  <text x="560" y="381" font-size="10" fill="#CECBF6" text-anchor="middle">문구 N개 중 하나</text>

  <rect x="440" y="415" width="240" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="560" y="437" font-size="14" font-weight="700" fill="#26215C" text-anchor="middle">🔎 후처리</text>
  <text x="560" y="454" font-size="11" fill="#534AB7" text-anchor="middle">문구 매핑 + 신뢰도 판단</text>

  <rect x="440" y="490" width="240" height="60" rx="10" fill="#534AB7" stroke="#3C3489" stroke-width="1.5"/>
  <text x="560" y="514" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">📣 출력</text>
  <text x="560" y="533" font-size="11" fill="#EEEDFE" text-anchor="middle">화면 텍스트  +  🔊 TTS 음성</text>

  <line x1="560" y1="170" x2="560" y2="193" stroke="#7F77DD" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="279" x2="560" y2="303" stroke="#7F77DD" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="389" x2="560" y2="413" stroke="#7F77DD" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="465" x2="560" y2="488" stroke="#7F77DD" stroke-width="2" marker-end="url(#arr)"/>

  <text x="195" y="108" font-size="13" font-weight="700" fill="#0F6E56" text-anchor="middle">▼ 학습 (모델 만들기)</text>

  <rect x="75" y="120" width="240" height="60" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="195" y="143" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">🗂️ 데이터</text>
  <text x="195" y="162" font-size="11" fill="#0F6E56" text-anchor="middle">자체 녹화 + AI Hub</text>

  <rect x="75" y="205" width="240" height="60" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="195" y="228" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">⚙️ 전처리 (공유)</text>
  <text x="195" y="247" font-size="11" fill="#0F6E56" text-anchor="middle">입 ROI → .npz 시퀀스</text>

  <rect x="75" y="290" width="240" height="74" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="195" y="313" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">🔁 학습 루프</text>
  <text x="195" y="332" font-size="11" fill="#0F6E56" text-anchor="middle">PyTorch (ROCm/GPU)</text>
  <text x="195" y="349" font-size="10" fill="#1D9E75" text-anchor="middle">CrossEntropy · Adam · TensorBoard</text>

  <rect x="75" y="389" width="240" height="56" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="195" y="412" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">💾 체크포인트 (.pt)</text>
  <text x="195" y="430" font-size="10" fill="#0F6E56" text-anchor="middle">학습된 가중치 (git 밖 보관)</text>

  <line x1="195" y1="180" x2="195" y2="203" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrT)"/>
  <line x1="195" y1="265" x2="195" y2="288" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrT)"/>
  <line x1="195" y1="364" x2="195" y2="387" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrT)"/>
  <path d="M315,410 L380,410 Q400,410 400,388 L400,347 L438,347" fill="none" stroke="#1D9E75" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrT)"/>
  <text x="370" y="402" font-size="10" fill="#0F6E56">모델에 로드</text>

  <rect x="75" y="600" width="790" height="58" rx="10" fill="#fff" stroke="#CECBF6" stroke-width="1.5"/>
  <text x="95" y="623" font-size="13" font-weight="700" fill="#26215C">🤝 협업 / 운영</text>
  <text x="95" y="645" font-size="11" fill="#534AB7">GitHub (코드·이슈·브랜치)   ·   클라우드 드라이브 (영상·.pt 보관, git 밖)   ·   GPU 환경은 회의서 결정</text>
</svg>